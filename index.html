<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll Dice</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Roll Dice Online" />
    <meta
      property="og:description"
      content="Experience a visually engaging dice rolling simulator. Enjoy interactive animations and realistic dice rolls."
    />
    <meta
      property="og:image"
      content="https://roll-dice-2to.pages.dev/img/thumbnail-600x400.png"
    />
    <meta property="og:url" content="https://roll-dice-2to.pages.dev/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roll Dice Online" />
    <meta
      name="twitter:description"
      content="Experience a visually engaging dice rolling simulator. Enjoy interactive animations and realistic dice rolls."
    />
    <meta
      name="twitter:image"
      content="https://roll-dice-2to.pages.dev/img/thumbnail-600x400.png"
    />

    <!-- Fallback for SEO -->
    <meta
      name="description"
      content="Experience a visually engaging dice rolling simulator. Enjoy interactive animations and realistic dice rolls."
    />

    <!-- Favicon Link -->
    <link rel="icon" type="image/png" href="img/dice-icon-1.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <h1>Roll the Dice</h1>
      <div class="container">
        <div class="dice">
          <div class="face front"></div>
          <div class="face back"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
          <div class="face right"></div>
          <div class="face left"></div>
        </div>
        <button class="roll">Roll Dice</button>
      </div>
    </main>
    <footer><p>© 2024 All rights reserved by Taher Mahmud Monmoy</p></footer>

    <script src="script.js"></script>
  </body>
</html>
